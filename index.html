<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Acervo da 2ª Vara</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F4F5F7; --surface:#FFFFFF; --surface-2:#F0F1F4; --surface-3:#E7E9EE; --ink:#15171C; --ink-2:#4B505B; --muted:#80858F; --line:#E2E4E9; --line-2:#ECEEF1;
  --side:#15171C; --side-ink:#C9CCD3; --side-mut:#7D828C; --side-hi:#FFFFFF; --side-act:#262932;
  --accent:#9B1D42; --accent-ink:#FFFFFF; --accent-soft:#FBE8EE;
  --pend:#C77A0A; --pend-bg:#FDF1DE; --agu:#12806A; --agu-bg:#DDF3EC; --baix:#2F5FD0; --baix-bg:#E3EBFB; --anom:#C23A2B; --anom-bg:#FBE3DF;
  --track:#E9EBEF; --grid:#EDEFF2;
  --shadow-s:0 1px 2px rgba(16,20,30,.05),0 1px 3px rgba(16,20,30,.06); --shadow:0 18px 50px rgba(16,20,30,.18);
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:"Geist Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1115; --surface:#171A20; --surface-2:#1D2129; --surface-3:#262B34; --ink:#ECEEF2; --ink-2:#B4B9C3; --muted:#838996; --line:#2A2F39; --line-2:#222730;
  --side:#0A0B0E; --side-ink:#B9BDC6; --side-mut:#6F7580; --side-hi:#FFFFFF; --side-act:#1D2129;
  --accent:#F07C9D; --accent-ink:#2A0512; --accent-soft:#3A1B25;
  --pend:#F0AE4A; --pend-bg:#35270F; --agu:#4CCBA9; --agu-bg:#12302A; --baix:#7FA3F5; --baix-bg:#1A2645; --anom:#F28A7C; --anom-bg:#3B1C18;
  --track:#252A33; --grid:#20242C; --shadow-s:0 1px 2px rgba(0,0,0,.4); --shadow:0 18px 50px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#0F1115; --surface:#171A20; --surface-2:#1D2129; --surface-3:#262B34; --ink:#ECEEF2; --ink-2:#B4B9C3; --muted:#838996; --line:#2A2F39; --line-2:#222730;
  --side:#0A0B0E; --side-ink:#B9BDC6; --side-mut:#6F7580; --side-hi:#FFFFFF; --side-act:#1D2129;
  --accent:#F07C9D; --accent-ink:#2A0512; --accent-soft:#3A1B25;
  --pend:#F0AE4A; --pend-bg:#35270F; --agu:#4CCBA9; --agu-bg:#12302A; --baix:#7FA3F5; --baix-bg:#1A2645; --anom:#F28A7C; --anom-bg:#3B1C18;
  --track:#252A33; --grid:#20242C; --shadow-s:0 1px 2px rgba(0,0,0,.4); --shadow:0 18px 50px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}

/* app shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{background:var(--side);color:var(--side-ink);padding:22px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:11px;align-items:center;padding:0 6px}
.seal{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:-.02em;flex:none}
.brand b{display:block;color:var(--side-hi);font-weight:600;font-size:14px;line-height:1.2}
.brand span{font-size:11.5px;color:var(--side-mut)}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--side-ink);padding:9px 10px;border-radius:9px;font-size:13.5px;font-weight:500;text-align:left}
.nav button:hover{background:var(--side-act);color:var(--side-hi)}
.nav button[aria-current="page"]{background:var(--side-act);color:var(--side-hi)}
.nav button[aria-current="page"] svg{color:#F07C9D}
.nav svg{width:18px;height:18px;flex:none}
.nav .c{margin-left:auto;font-size:11.5px;color:var(--side-mut);font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;display:grid;gap:10px;font-size:12px;color:var(--side-mut);padding:0 6px}
.save{display:inline-flex;align-items:center;gap:7px}
.save i{width:7px;height:7px;border-radius:50%;background:var(--side-mut)}
.save[data-s="ok"] i{background:#4CCBA9} .save[data-s="busy"] i{background:#F0AE4A} .save[data-s="local"] i{background:#7FA3F5} .save[data-s="err"] i{background:#F28A7C}

.main{min-width:0;padding:22px 28px 60px;display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-content:start}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between}
.top h1{margin:0;font-size:24px;font-weight:600;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-weight:500;font-size:13px;display:inline-flex;gap:7px;align-items:center;box-shadow:var(--shadow-s);white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--anom)}
.btn svg{width:15px;height:15px}

/* filter bar */
.fbar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:var(--shadow-s);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.search{flex:1 1 260px;min-width:0;display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:9px;padding:0 10px}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.search input{border:0;background:transparent;padding:8px 0;width:100%;outline:none}
.search kbd{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.fbar select{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 8px;font-size:13px;max-width:100%;min-width:0}
.fbar select.set{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tgl{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;user-select:none;background:var(--surface)}
.tgl input{accent-color:var(--accent);margin:0}
.tgl:has(input:checked){border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);min-height:0}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--ink);color:var(--surface);padding:3px 6px 3px 10px;font-size:12px;border:0}
.chip span{opacity:.7}
.chip b{font-weight:500}
.chip i{font-style:normal;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.18);font-size:11px}

/* cards */
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.main>*,.grid>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-s);min-width:0}
.card-h{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;padding:16px 18px 6px}
.card-h h2{margin:0;font-size:14px;font-weight:600}
.card-h .hint{font-size:12px;color:var(--muted)}
.card-b{padding:8px 18px 18px}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:8px;text-align:left;box-shadow:var(--shadow-s);position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
button.kpi:hover{transform:translateY(-2px);border-color:var(--muted)}
.kpi.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.kpi .lbl{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.kpi .dot{width:9px;height:9px;border-radius:3px}
.kpi .val{font-size:32px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:14px;font-weight:500;color:var(--muted);margin-left:6px;letter-spacing:0}
.kpi .note{font-size:12px;color:var(--muted)}
.kpi .meter{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.kpi .meter span{display:block;height:100%;border-radius:3px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:620px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .val{font-size:26px}}

.ov{grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
.ov2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1000px){.ov,.ov2{grid-template-columns:minmax(0,1fr)}}

/* donut */
.donut-wrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap;justify-content:center}
.donut{width:210px;max-width:100%;aspect-ratio:1}
.donut circle.seg{transition:stroke-dasharray .6s cubic-bezier(.2,.8,.2,1),stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1),opacity .15s;cursor:pointer}
.donut:hover circle.seg{opacity:.45}
.donut circle.seg:hover,.donut circle.seg.on{opacity:1}
.dleg{display:grid;gap:8px;min-width:200px;flex:1}
.dleg button{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;border:0;background:transparent;text-align:left;padding:6px 8px;border-radius:8px;font-size:13px}
.dleg button:hover,.dleg button.on{background:var(--surface-2)}
.dleg i{width:12px;height:12px;border-radius:4px}
.dleg .n{font-weight:600;font-variant-numeric:tabular-nums}
.dleg .p{color:var(--muted);font-size:12px;width:48px;text-align:right;font-variant-numeric:tabular-nums}

/* stacked bars */
.sb{display:grid;gap:4px}
.sb .row{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 92px;gap:12px;align-items:center;padding:6px 8px;border-radius:9px;cursor:pointer;border:0;background:transparent;text-align:left;width:100%}
.sb .row:hover{background:var(--surface-2)}
.sb .row.on{background:var(--accent-soft)}
.sb .nm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb .tr{height:14px;border-radius:4px;display:flex;gap:2px;overflow:hidden;background:transparent}
.sb .tr span{height:100%;transition:flex-basis .5s cubic-bezier(.2,.8,.2,1);min-width:0}
.sb .tr span:first-child{border-radius:4px 0 0 4px}
.sb .tr span:last-child{border-radius:0 4px 4px 0}
.sb .st{font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sb .st b{color:var(--ink);font-weight:600;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
@media (max-width:520px){.sb .row{grid-template-columns:minmax(0,1fr) 80px}.sb .tr{grid-column:1/-1;grid-row:2}}

/* column chart */
.cols svg{width:100%;height:auto;display:block}
.cols .bar{cursor:pointer;transition:opacity .15s}
.cols svg:hover .bar{opacity:.55}
.cols .bar:hover,.cols .bar.on{opacity:1}

/* insights */
.ins{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ins li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;padding:10px;border-radius:12px;background:var(--surface-2)}
.ins .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:13px}
.ins p{margin:0;font-size:13px;color:var(--ink-2)}
.ins p b{color:var(--ink)}
.ins button{border:0;background:none;color:var(--accent);padding:0;font-size:12.5px;font-weight:500;margin-top:3px}

/* metas */
.metas{grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr))}
.old li{min-width:0}.old .cl{min-width:0}.old .mono{flex:none}
.mcard{padding:18px;display:grid;gap:14px}
.mcard .hd{display:flex;align-items:center;gap:14px}
.ring{width:74px;height:74px;flex:none}
.ring circle{transition:stroke-dasharray .6s cubic-bezier(.2,.8,.2,1)}
.mcard h3{margin:0;font-size:16px;font-weight:600}
.mcard .sub{font-size:12.5px;color:var(--muted)}
.mstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mstats div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.mstats b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.mstats span{font-size:11.5px;color:var(--muted)}
.old{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.old li button{width:100%;display:flex;justify-content:space-between;gap:8px;border:0;background:transparent;padding:5px 6px;border-radius:7px;font-size:12.5px;text-align:left}
.old li button:hover{background:var(--surface-2)}
.old .cl{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* table */
.tbl-wrap{overflow:auto;max-height:calc(100vh - 210px);border-top:1px solid var(--line-2)}
table{border-collapse:separate;border-spacing:0;width:100%}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-2);vertical-align:middle}
thead th{position:sticky;top:0;background:var(--surface);z-index:2;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:500;white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--ink)}
tbody tr:hover td{background:var(--surface-2)}
tbody tr.focus td{background:var(--accent-soft)}
td{font-size:13px}
td.cls{min-width:190px;max-width:260px;color:var(--ink-2)}
td.pn{white-space:nowrap}
td.pn button{border:0;background:none;padding:0;font-family:var(--mono);font-size:12.5px;color:var(--ink);text-align:left}
td.pn button:hover{color:var(--accent);text-decoration:underline}
td.ob{min-width:260px;width:30%}
.iobs{width:100%;min-height:32px;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 8px;resize:none;overflow:hidden;line-height:1.4;font-size:13px;display:block;transition:border-color .12s,background .12s}
.iobs::placeholder{color:var(--muted);opacity:.7}
tr:hover .iobs{border-color:var(--line)}
.iobs:focus{border-color:var(--accent);background:var(--surface);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.iobs.saved{border-color:var(--agu)}
.star{border:0;background:transparent;padding:2px;color:var(--line);font-size:17px;line-height:1}
.star.on{color:var(--pend)}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:500;min-width:46px;color:var(--muted)}
.tog.yes{background:var(--agu-bg);border-color:transparent;color:var(--agu)}
.tog.b.yes{background:var(--baix-bg);color:var(--baix)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-pend{background:var(--pend-bg);color:var(--pend)} .st-agu{background:var(--agu-bg);color:var(--agu)} .st-baix{background:var(--baix-bg);color:var(--baix)} .st-anom{background:var(--anom-bg);color:var(--anom)}
.tag{display:inline-block;font-size:11.5px;padding:1px 7px;border-radius:6px;background:var(--surface-3);color:var(--ink-2);white-space:nowrap}
.tag.meta{background:var(--accent-soft);color:var(--accent)}
.ed{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:6px;vertical-align:2px}
.hint{font-size:12px;color:var(--muted)}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.open{border:0;background:transparent;color:var(--muted);padding:4px 6px;border-radius:6px;font-size:16px}
.open:hover{background:var(--surface-3);color:var(--ink)}

/* board */
.board{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:14px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface-2);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:300px;border:2px dashed transparent;transition:border-color .12s,background .12s}
.col.over{border-color:var(--accent);background:var(--accent-soft)}
.col-h{display:flex;align-items:center;gap:8px;padding:4px 6px 6px;font-weight:600;font-size:13px}
.col-h i{width:10px;height:10px;border-radius:3px}
.col-h .n{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;background:var(--surface);border-radius:999px;padding:1px 8px}
.kc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:6px;cursor:grab;box-shadow:var(--shadow-s);transition:transform .12s,box-shadow .12s}
.kc:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(16,20,30,.1)}
.kc.drag{opacity:.4}
.kc .t{display:flex;justify-content:space-between;gap:8px;align-items:center}
.kc .t .mono{font-size:12px}
.kc .c{font-size:12px;color:var(--ink-2);line-height:1.35}
.kc .o{font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding-left:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kc .tags{display:flex;gap:5px;flex-wrap:wrap}
.kc.anom{border-color:var(--anom)}
.more{border:0;background:transparent;color:var(--ink-2);font-size:12.5px;padding:8px;border-radius:8px}
.more:hover{background:var(--surface)}

/* drawer & modal */
.veil{position:fixed;inset:0;background:rgba(10,12,16,.4);z-index:20;backdrop-filter:blur(2px)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dh{padding:18px 20px 14px;border-bottom:1px solid var(--line-2);display:grid;gap:8px}
.dh .row{display:flex;gap:10px;align-items:center;justify-content:space-between}
.dh .pnum{font-family:var(--mono);font-size:17px;font-weight:500;word-break:break-all}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.dbody{padding:16px 20px 24px;overflow:auto;display:grid;gap:18px;align-content:start}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:460px){.fgrid{grid-template-columns:1fr}}
.field{display:grid;gap:5px}
.field>label,.field>.lb{font-size:12px;color:var(--ink-2);font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:9px;padding:7px 10px;width:100%}
.field textarea{min-height:120px;resize:vertical;line-height:1.5}
.yn{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;width:max-content}
.yn button{border:0;background:transparent;padding:5px 14px;font-size:13px;font-weight:500;color:var(--ink-2);border-radius:7px}
.yn button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-s)}

let wq=Promise.resolve(), inflight=0;
function setSave(s,txt){ $("#save").dataset.s=s; $("#saveTxt").textContent=txt||({ok:"Salvo · sincronizado",busy:"Salvando…",local:"Salvo neste navegador",err:"Erro ao salvar"}[s]); }
function put(coll,id,doc){
  if(doc) S[coll][id]=doc; else delete S[coll][id];
  if(coll==="edicoes"||coll==="novos") dirty();
  if(mode!=="db"){ if(!saveLocal()) setSave("err","Sem espaço no navegador"); else setSave("local"); return; }

  const body=doc?JSON.parse(JSON.stringify(doc)):null;
  const run=async()=>{ const ref=db.doc(coll+"/"+id); try{ body?await ref.set(body):await ref.delete(); } catch(err){ if(err&&err.code==="unavailable"){ await new Promise(r=>setTimeout(r,600+Math.random()*800)); body?await ref.set(body):await ref.delete(); } else throw err; } };
  wq=wq.then(run).catch(err=>{
    if(err&&(err.code==="invalid_argument"||err.code==="permission-denied")){ readOnly=true; setSave("err","Somente leitura"); toast("Você tem acesso somente de leitura a este painel."); }
    else if(err&&err.code==="quota_exceeded") toast("Limite de registros do painel atingido.");
    else toast("Uma alteração não foi salva. Tente de novo.");
    throw err;
  }).then(()=>{},()=>{}).finally(()=>{ if(PENDING[coll].get(id)===(doc||null)) PENDING[coll].delete(id); inflight--; if(!inflight&&!readOnly) setSave("ok"); else if(inflight) setSave("busy",inflight>1?`Salvando… (${inflight})`:"Salvando…"); });
}

function buildEdit(id,patch,note){
  const cur=S.edicoes[id]||{}, r=byId(id); if(!r) return null;
  patch={...patch};
  if(patch.fase&&/^Concluso/.test(patch.fase)&&!r.dtC&&patch.dtC===undefined) patch.dtC=today();
  if(patch.s===true&&patch.dtS===undefined&&!r.dtS) patch.dtS=today();
  if(patch.b===true&&patch.dtB===undefined&&!r.dtB) patch.dtB=today();
  if(patch.b===true&&patch.s===undefined&&!r.s) patch.s=true;
  if(patch.s===false){ if(patch.prov===undefined) patch.prov=""; if(patch.dtS===undefined) patch.dtS=""; if(patch.tipoS===undefined) patch.tipoS=""; if(r.b&&patch.b===undefined){ patch.b=false; patch.dtB=""; } }
  if(patch.b===false&&patch.dtB===undefined) patch.dtB="";
  if(patch.b===true&&patch.prov===undefined&&r.prov) patch.prov="";
  const hist=(cur.hist||[]).slice(); let changed=false;
  for(const k in patch){
    const before=r[k], after=patch[k];
    if(stable(before)===stable(after)) continue; changed=true;
    if(COMPLEX.has(k)) continue;
    if(k==="obs"){ if(!hist.length||hist[0].k!=="obs"||Date.now()-hist[0].t>600000) hist.unshift({t:Date.now(),k:"obs",v:"editada",por:UI.eu}); else hist[0]={...hist[0],t:Date.now(),por:UI.eu}; }
    else hist.unshift({t:Date.now(),k,de:show(k,before),para:show(k,after),por:UI.eu});
  }
  if(!changed) return null;
  if(note) hist.unshift({t:Date.now(),k:"nota",v:note,por:UI.eu});
  return {...cur,...patch,upd:Date.now(),updBy:UI.eu,hist:hist.slice(0,25)};
}
const UNDO=[];
function pushUndo(label,entries){ if(!entries.length) return; UNDO.push({label,entries}); if(UNDO.length>40) UNDO.shift(); atualizaUndo(); }
function atualizaUndo(){ const b=$("#bUndo"); if(!b) return; b.disabled=!UNDO.length; b.title=UNDO.length?`Desfazer: ${UNDO[UNDO.length-1].label} (Ctrl+Z)`:"Nada para desfazer"; }
function desfazer(){
  const u=UNDO.pop(); if(!u){ toast("Nada para desfazer."); return; }
  if(readOnly||needLogin()) return;
  for(const e of u.entries) put(e.coll,e.id,e.prev);
  dirty(); atualizaUndo(); scheduleSnap(); render(); toast(`Desfeito: ${u.label}`);
}

  put("edicoes",id,next); scheduleSnap();
  if(!(opts&&opts.silent)) render();
}
function editMany(ids,fn,label){

}

function autorizados(){ const m={}; for(const k in FUNDADORES) m[k]={login:k,...FUNDADORES[k],fundador:true}; for(const id in (S.autorizados||{})){ const a=S.autorizados[id]; if(a) m[id]={...(m[id]||{}),...a,login:id,fundador:!!FUNDADORES[id]}; } return m; }
function refreshTeam(){ const A=autorizados(); const P={Felipe:"Gabinete",Keomas:"Gabinete",Shelton:"Cartório"}; for(const k in A){ if(A[k].nome) P[A[k].nome]=A[k].papel||"A definir"; } PAPEL=P; }
function loginOf(nome){ const A=autorizados(); for(const k in A) if(A[k].nome===nome) return k; return ""; }
function teamNames(){ return Object.values(autorizados()).map(a=>a.nome).filter(Boolean); }

function gateHtml(mode,msg){
  if(!FIREBASE_CONFIG) return `<div class="gate-card"><div class="seal">2ª</div><h1>Painel ainda não configurado</h1><p>Falta colar a configuração do Firebase neste arquivo. Abra o <b>index.html</b> no Bloco de Notas, procure <code>/*CONFIG*/ null /*FIM-CONFIG*/</code> e troque <code>null</code> pelo bloco copiado do console do Firebase — veja o passo a passo.</p></div>`;
  const first=mode==="primeiro";
  return `<form class="gate-card" id="gForm" autocomplete="on"><img class="logo" src="logo.png" alt="Tribunal de Justiça do Estado do Espírito Santo" onerror="this.remove()"><div class="seal"><span>2ª</span></div><h1>Acervo da 2ª Vara</h1><p class="hint">Afonso Cláudio · TJES</p>
    <div class="field"><label for="gLogin">Login do TJES</label><input id="gLogin" name="username" autocomplete="username" required autocapitalize="none" spellcheck="false"></div>
    <div class="field"><label for="gSenha">${first?"Crie uma senha (mínimo 6 caracteres)":"Senha do painel"}</label><input id="gSenha" type="password" name="password" autocomplete="${first?"new-password":"current-password"}" required minlength="6"></div>
    ${first?`<div class="field"><label for="gSenha2">Repita a senha</label><input id="gSenha2" type="password" autocomplete="new-password" required minlength="6"></div>`:""}
    ${msg?`<div class="gmsg">${msg}</div>`:""}
    <button type="submit" class="btn primary gbtn">${first?"Criar senha e entrar":"Entrar"}</button>
    <button type="button" class="btn ghost" id="gMode">${first?"Já tenho senha — entrar":"Primeiro acesso? Criar senha"}</button>
    <p class="hint" style="margin:0">Só entra quem tem o login autorizado na aba <b>Acessos</b>. A senha é deste painel — não é a senha do TJES. Esqueceu a senha? Peça a quem administra o projeto no Firebase para excluir seu usuário e faça o primeiro acesso de novo.</p></form>`;
}
function showGate(mode,msg){
  const G=$("#gate"); G.hidden=false; document.body.classList.add("gated");
  G.innerHTML=gateHtml(mode,msg);
  const f=$("#gForm"); if(!f) return;
  setTimeout(()=>{ const i=$("#gLogin"); i&&i.focus(); },30);
  $("#gMode").onclick=()=>showGate(mode==="primeiro"?"entrar":"primeiro");
  f.addEventListener("submit",async ev=>{
    ev.preventDefault();
    const login=normLogin($("#gLogin").value), senha=$("#gSenha").value;
    const btn=f.querySelector(".gbtn"); btn.disabled=true; btn.textContent="Verificando…";
    const fail=m=>{ showGate(mode,m); const i=$("#gLogin"); if(i) i.value=login; };
    try{
      if(!login) return fail("Informe o login.");
      let ok=!!FUNDADORES[login];
      if(!ok){ try{ ok=(await FS.doc("autorizados/"+login).get()).exists; }catch(e){ ok=false; } }
      if(!ok) return fail(`O login <b>${esc(login)}</b> não está autorizado. Peça a um colega autorizado para incluí-lo na aba Acessos.`);
      const email=login+"@"+LOGIN_DOMAIN;
      if(mode==="primeiro"){
        if(senha.length<6) return fail("A senha precisa ter pelo menos 6 caracteres.");
        if(senha!==$("#gSenha2").value) return fail("As senhas não conferem.");
        try{ await AUTH.createUserWithEmailAndPassword(email,senha); }
        catch(e){ return fail(e&&e.code==="auth/email-already-in-use"?"Esse login já tem senha. Clique em “Já tenho senha — entrar”.":"Não foi possível criar a senha ("+esc(e&&e.code||"erro")+")."); }
      } else {
        try{ await AUTH.signInWithEmailAndPassword(email,senha); }
        catch(e){ const c=e&&e.code||""; return fail(/too-many/.test(c)?"Muitas tentativas. Aguarde alguns minutos.":"Login ou senha incorretos. Se é seu primeiro acesso, clique em “Primeiro acesso? Criar senha”."); }
      }
    }catch(e){ fail("Erro inesperado. Tente de novo."); }
  });
}
function hideGate(){ const G=$("#gate"); G.hidden=true; G.innerHTML=""; document.body.classList.remove("gated"); }

function fbInit(){
  if(!FIREBASE_CONFIG||!window.firebase){ showGate("entrar"); return; }
  firebase.initializeApp(FIREBASE_CONFIG);
  AUTH=firebase.auth(); FS=firebase.firestore();
  try{ FS.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(e){}
  showGate("entrar");
  AUTH.onAuthStateChanged(async user=>{
    if(!user){ ME=null; UI.eu=""; showGate("entrar"); return; }
    const login=String(user.email||"").split("@")[0];
    let doc=null; try{ const s=await FS.doc("autorizados/"+login).get(); doc=s.exists?s.data():null; }catch(e){}
    if(!doc&&!FUNDADORES[login]){ await AUTH.signOut(); showGate("entrar",`O login <b>${esc(login)}</b> não está mais autorizado.`); return; }
    const base=FUNDADORES[login]||{};
    ME={login,nome:(doc&&doc.nome)||base.nome||login,papel:(doc&&doc.papel)||base.papel||"A definir"};
    UI.eu=ME.nome; persistUI();
    try{ if(!doc||!doc.ativadoEm) await FS.doc("autorizados/"+login).set({nome:ME.nome,papel:ME.papel,ativadoEm:Date.now(),...(doc?{}:{por:"(fundador)",em:Date.now()})},{merge:true}); }catch(e){}
    hideGate(); startData();
  });
}
let dataStarted=false, chatG={}, chatD={};
function startData(){
  if(dataStarted){ render(); return; } dataStarted=true;
  db=FS; mode="db"; setSave("busy","Carregando…"); $("#bannerBox").innerHTML="";
  const sub=(coll,q)=>{ let first=true; q.onSnapshot(snap=>{
      const m={}; snap.docs.forEach(d=>{ if(d.exists) m[d.id]=d.data(); });
      (PENDING[coll]||new Map()).forEach((v,id)=>{ if(v) m[id]=v; else delete m[id]; });
      if(coll==="edicoes"&&first){ first=false; if(!inflight) setSave("ok"); }
      if(stable(m)===stable(S[coll])) return;
      S[coll]=m; if(coll==="edicoes"||coll==="novos") dirty(); if(coll==="comentarios") indexComs(); if(coll==="autorizados"){ refreshTeam(); dirty(); }
      renderSoft();
    },err=>{ if(err&&err.code==="permission-denied"){ setSave("err","Sem permissão"); if(coll==="edicoes") toast("Seu login não tem permissão. Peça para ser autorizado na aba Acessos."); } else if(coll==="edicoes") setSave("err","Sincronização interrompida"); }); };
  for(const coll of ["edicoes","novos","filtros","snapshots","importacoes","config","comentarios","autorizados"]) sub(coll,FS.collection(coll));
  const chatSub=(q,which)=>q.onSnapshot(snap=>{ const m={}; snap.docs.forEach(d=>{ m[d.id]=d.data(); }); if(which==="g") chatG=m; else chatD=m; const all_={...chatG,...chatD}; PENDING.chat.forEach((v,id)=>{ if(v) all_[id]=v; }); if(stable(all_)===stable(S.chat)) return; S.chat=all_; renderChat(); renderNavCounts(); },()=>{});
  chatSub(FS.collection("chat").where("conv","==","geral"),"g");
  chatSub(FS.collection("chat").where("part","array-contains",ME.login),"d");
  FS.doc("base/atual").onSnapshot(d=>{ if(d.exists){ const v=d.data(); if(v&&Array.isArray(v.rows)&&v.rows.length){ if(v.em===BASEINFO.em&&v.arquivo===BASEINFO.arquivo&&v.rows.length===BASE.length) return; BASE=v.rows.map(fromRow); BASEINFO=v; } } else { if(BASEINFO===SEED_INFO) return; BASE=SEED.map(fromRow); BASEINFO=SEED_INFO; } dirty(); renderSoft(); checkEmpty(); },()=>{});
  render();
  setTimeout(checkEmpty,2500);
}
function checkEmpty(){ if(!BASE.length&&!Object.keys(S.novos).length) $("#bannerBox").innerHTML='<div class="banner"><b>Nenhuma planilha carregada.</b> Clique em <b>Importar</b> no topo e escolha a exportação do acervo (.xlsx). Os dados ficam guardados só no banco protegido, e não no site.</div>'; else $("#bannerBox").innerHTML=""; }
function sair(){ if(AUTH) AUTH.signOut().then(()=>location.reload()); }

  <div class="scroll"><table><thead><tr><th>Login do TJES</th><th>Nome no painel</th><th>Frente</th><th>Situação</th><th>Autorizado por</th><th></th></tr></thead><tbody>
  ${A.map(a=>`<tr><td class="mono">${esc(a.login)}${a.login===(ME&&ME.login)?' <span class="you">você</span>':""}</td>
    <td><input class="ain" data-anome="${esc(a.login)}" value="${esc(a.nome||"")}" maxlength="30" aria-label="Nome de ${esc(a.login)}"></td>
    <td><select class="ain" data-apapel="${esc(a.login)}" aria-label="Frente de ${esc(a.login)}">${PAPEIS.map(p=>`<option${p===(a.papel||"A definir")?" selected":""}>${p}</option>`).join("")}</select></td>
    <td>${a.ativadoEm?`<span class="pill st-agu">Senha criada</span>`:`<span class="pill st-pend">Aguardando 1º acesso</span>`}</td>
    <td class="hint">${a.fundador?"Autorização inicial":`${esc(a.por||"—")}${a.em?" · "+fmtDate(new Date(a.em).toISOString().slice(0,10)):""}`}</td>
    <td>${a.fundador?'<span class="hint">fixo</span>':a.login===(ME&&ME.login)?"":`<button type="button" class="btn ghost danger" data-arm="${esc(a.login)}">Remover</button>`}</td></tr>`).join("")}
  </tbody></table></div>
  <div class="card-b"><form class="aform" id="aForm"><div class="field"><label for="aLogin">Novo login do TJES</label><input id="aLogin" required placeholder="ex.: mfsilva" autocapitalize="none" spellcheck="false"></div><div class="field"><label for="aNome">Nome no painel</label><input id="aNome" required maxlength="30" placeholder="ex.: Maria"></div><div class="field"><label for="aPapel">Frente</label><select id="aPapel">${PAPEIS.map(p=>`<option>${p}</option>`).join("")}</select></div><button type="submit" class="btn primary">Autorizar</button></form>
  <p class="hint" style="margin:12px 0 0">A pessoa entra com esse login e cria a própria senha em “Primeiro acesso”. Remover um login bloqueia o acesso aos dados na hora. Os quatro logins iniciais são fixos e só podem ser retirados pelas regras do Firebase.</p></div></div>`;
}
function acessosEvents(V){
  V.addEventListener("submit",e=>{ if(e.target.id!=="aForm") return; e.preventDefault();
    const login=normLogin($("#aLogin").value), nome=$("#aNome").value.trim().replace(/\s+/g," "), papel=$("#aPapel").value;
    if(!login||!nome){ toast("Preencha login e nome."); return; }
    if(autorizados()[login]){ toast("Esse login já está autorizado."); return; }
    if(teamNames().includes(nome)){ toast("Já existe alguém com esse nome no painel. Use um nome diferente."); return; }
    put("autorizados",login,{nome,papel,por:UI.eu,em:Date.now()}); refreshTeam(); renderMain(); toast(`Login ${login} autorizado.`); });
  V.addEventListener("change",e=>{ const t=e.target; const ln=t.dataset.anome, lp=t.dataset.apapel; const lg=ln||lp; if(!lg) return; const cur={...(autorizados()[lg]||{})}; delete cur.login; delete cur.fundador;
    if(ln){ const v=t.value.trim(); if(!v){ t.value=cur.nome||""; return; } cur.nome=v; } else cur.papel=t.value;
    put("autorizados",lg,cur); refreshTeam(); if(ME&&lg===ME.login&&ln){ ME.nome=cur.nome; UI.eu=cur.nome; } renderMain(); toast("Acesso atualizado."); });
  V.addEventListener("click",e=>{ const b=e.target.closest("[data-arm]"); if(!b) return; const lg=b.dataset.arm; if(b.dataset.ok!=="1"){ b.dataset.ok="1"; b.textContent="Confirmar remoção"; return; } put("autorizados",lg,null); refreshTeam(); renderMain(); toast(`Login ${lg} removido.`); });
}

/* ---------- filters ---------- */
function filtered(rows,except){
  const q=UI.q.trim().toLowerCase(), qd=q.replace(/\D/g,"");
  return rows.filter(r=>{
    if(UI.lista&&!UI.lista.ids.has(r.id)) return false;
    if(UI.grupo&&except!=="grupo"&&except!=="grupo_sit"){ if(UI.grupo==="baixa"){ if(r.sit!=="agu") return false; } else if(r.grupo!==UI.grupo||r.sit!=="pend") return false; }
    if(UI.prov&&except!=="prov"&&(r.sit!=="agu"||(UI.prov==="__none"?r.prov:r.prov!==UI.prov))) return false;
    if(UI.view==="fila"&&except!=="fila"&&(!UI.eu||r.resp!==UI.eu||r.b)) return false;
    if(q && !(r.n.toLowerCase().includes(q)||(qd.length>=3&&r.n.replace(/\D/g,"").includes(qd))||r.classe.toLowerCase().includes(q)||r.obs.toLowerCase().includes(q)||r.fase.toLowerCase().includes(q)||r.resp.toLowerCase().includes(q))) return false;
    for(const k of ["sit","meta","tema","area","classe","ano"]) if(UI[k]&&except!==k&&!(except==="meta_tema"&&(k==="meta"||k==="tema"))&&!(except==="grupo_sit"&&k==="sit")&&r[k]!==UI[k]) return false;
    if(UI.fase&&except!=="fase"&&(UI.fase==="__none"?r.fase:r.fase!==UI.fase)) return false;
    if(UI.tipoS&&except!=="tipoS"&&(UI.tipoS==="__none"?(!r.s||r.tipoS):r.tipoS!==UI.tipoS)) return false;
    if(UI.leg&&except!=="leg"&&!r.leg.includes(UI.leg)) return false;
    if(UI.resp&&except!=="resp"&&(UI.resp==="__none"?r.resp:r.resp!==UI.resp)) return false;
    if(UI.parado&&except!=="parado"&&!paradoMatch(r,UI.parado)) return false;
    if(UI.tag&&except!=="tag"&&!r.tags.includes(UI.tag)) return false;
    if(UI.acomp&&except!=="acomp"){ const a=UI.acomp; if(a==="pend"&&!(r.pendc&&r.pendc.st==="aberta")) return false; if(a==="aud"&&!r.nextAud) return false; if(a==="tj"&&r.noTJ==null) return false; if(a==="chk"&&!(r.sit==="agu"&&chkProg(r)[0]<chkProg(r)[1])) return false; if(a==="com"&&!(COMS.get(r.id)||[]).length) return false; }
    if(UI.prio&&!r.prio) return false;
    if(UI.obs&&!r.obs.trim()) return false;
    return true;
  });
}
function paradoMatch(r,v){ if(v==="sem") return r.sit==="pend"&&!r.dtC; if(r.dias==null) return false; if(v==="lim") return r.dias>CFG().limite; const [a,c]=v.split("-"); return r.dias>=+a&&r.dias<=(c?+c:1e9); }
const PARADO={"0-30":"Concluso há até 30 dias","31-60":"Concluso há 31–60 dias","61-100":"Concluso há 61–100 dias","101-":"Concluso há mais de 100 dias","lim":"Concluso além do limite","sem":"Pendente sem data de conclusão"};
const FLBL={tag:"Etiqueta",acomp:"Acompanhamento",grupo:"Assunto",prov:"Providência",sit:"Situação",meta:"Meta",tema:"Matéria",area:"Área",classe:"Classe",ano:"Ano",fase:"Fase",tipoS:"Tipo de sentença",leg:"Prioridade legal",resp:"Responsável",parado:"Prazo"};
const ACOMP={pend:"Com pendência aberta",aud:"Com audiência designada",tj:"Remetidos ao TJ",chk:"Checklist da baixa incompleto",com:"Com comentários"};
function fval(k,v){ if(k==="acomp") return ACOMP[v]||v; if(k==="tag") return "#"+v; if(k==="grupo") return GLBL[v]||v; if(k==="prov"&&v==="__none") return "não definida"; if(k==="sit") return SIT[v]; if(k==="tema") return temaLbl(v); if(k==="parado") return PARADO[v]||v; if(v==="__none") return k==="tipoS"?"não informado":k==="resp"?"sem responsável":"sem fase"; return v; }
function setF(k,v){ UI[k] = UI[k]===v ? "" : v; UI.sel.clear(); renderMain(); }

/* ---------- render ---------- */
function renderSoft(){
  const a=document.activeElement;
  if(a&&(a.classList.contains("iobs")||(a.closest&&a.closest(".drawer,.modal")&&/TEXTAREA|INPUT|SELECT/.test(a.tagName)))){ renderMain(true); if(!a.closest(".drawer,.modal")) {} return; }
  render();
}
function render(){ renderMain(); renderDrawer(); if(chatOpen) renderChat(); }
const VIEWS={acessos:["Acessos","Logins do TJES autorizados a usar o painel"],hoje:["Meu dia","Pendências, audiências, menções e lembretes"],agenda:["Agenda de audiências","Designadas, próximas e sem resultado registrado"],geral:["Visão geral","Duas frentes: o gabinete sentencia, o cartório baixa"],tabela:["Planilha de processos","Clique na observação para editar · selecione linhas para ações em lote"],quadro:["Quadro de situação","Arraste um cartão para mudar a situação do processo"],metas:["Metas CNJ","Ritmo necessário, progresso e processos mais antigos pendentes"],prazos:["Prazos","Processos conclusos e tempo parado"],fila:["Minha fila","Processos atribuídos a você e ainda não baixados"],registro:["Registro de alterações","Quem alterou o quê, e quando"]};
function renderMain(keepTable){
  const rows=all(), cfg=CFG();
  renderSelects(rows);
  const f=filtered(rows);
  const chips=[];
  if(UI.lista) chips.push(`<button class="chip lista" type="button" data-clr="lista"><b>${esc(UI.lista.nome)}</b><span>${fmtN(UI.lista.ids.size)}</span><i>✕</i></button>`);
  for(const k in FLBL) if(UI[k]) chips.push(`<button class="chip" type="button" data-clr="${k}"><span>${FLBL[k]}</span><b>${esc(fval(k,UI[k]))}</b><i>✕</i></button>`);
  if(UI.q.trim()) chips.push(`<button class="chip" type="button" data-clr="q"><span>Busca</span><b>${esc(UI.q.trim())}</b><i>✕</i></button>`);
  if(UI.prio) chips.push(`<button class="chip" type="button" data-clr="prio"><b>Prioritários</b><i>✕</i></button>`);
  if(UI.obs) chips.push(`<button class="chip" type="button" data-clr="obs"><b>Com observação</b><i>✕</i></button>`);
  $("#chips").innerHTML = chips.length ? `<span>${fmtN(f.length)} de ${fmtN(rows.length)} processos</span>${chips.join("")}<button class="save-f" type="button" id="bSaveF">+ Salvar filtro</button><button class="btn ghost" type="button" data-clr="all" style="padding:3px 8px">Limpar tudo</button>` : "";
  $("#cT").textContent=fmtN(filtered(rows,"fila").length);
  { const np=rows.filter(r=>r.dias!=null&&r.dias>cfg.limite).length; $("#cP").textContent=np?fmtN(np):""; }
  renderNavCounts();
  $("#cF").textContent=UI.eu?fmtN(rows.filter(r=>r.resp===UI.eu&&!r.b).length):"";
  document.querySelectorAll("#nav button").forEach(b=>b.setAttribute("aria-current",b.dataset.view===UI.view?"page":"false"));
  const fl=Object.entries(S.filtros).sort((a,b)=>(a[1].nome||"").localeCompare(b[1].nome||"","pt"));
  $("#savedF").innerHTML = fl.length ? fl.map(([id,x])=>`<div class="sf"><button type="button" data-sf="${esc(id)}" title="${esc(x.nome)}">${esc(x.nome)}</button><button type="button" class="x" data-sfx="${esc(id)}" aria-label="Excluir filtro ${esc(x.nome)}">✕</button></div>`).join("") : '<div class="side-empty">Aplique filtros e clique em “Salvar filtro”.</div>';
  const T=VIEWS[UI.view]; $("#vTitle").textContent=T[0]+(UI.view==="fila"&&UI.eu?` · ${UI.eu}`:""); $("#vSub").textContent=T[1];
  $("#baseInfo").textContent=`Base: ${BASEINFO.arquivo||"planilha"} · ${fmtN(rows.length)} processos`;
  const V=$("#view");
  if(V.dataset.v!==UI.view){ V.dataset.v=UI.view; V.classList.remove("view"); void V.offsetWidth; V.classList.add("view"); keepTable=false; }
  if(UI.view==="geral") V.innerHTML=viewGeral(f);
  else if(UI.view==="tabela"||UI.view==="fila"){ if(!(keepTable&&V.querySelector("#plist"))) V.innerHTML=viewTabela(f); else updateTableHeadless(f); }
  else if(UI.view==="quadro") V.innerHTML=viewQuadro(f);
  else if(UI.view==="metas") V.innerHTML=viewMetas(f);
  else if(UI.view==="registro") V.innerHTML=viewRegistro();
  else if(UI.view==="hoje") V.innerHTML=viewHoje();
  else if(UI.view==="acessos") V.innerHTML=viewAcessos();
  else if(UI.view==="agenda") V.innerHTML=viewAgenda(f);
  else V.innerHTML=viewPrazos(f);
  const bu=$("#bUser"); if(bu) bu.innerHTML=UI.eu?`<span class="avatar">${esc(initials(UI.eu))}</span><span><b>${esc(UI.eu)}</b><br><span class="hint">${esc(ME?ME.login:"")} · sair</span></span>`:`<span class="avatar">?</span><span><b>Entrar</b><br><span class="hint">para editar</span></span>`;
  if(UI.view==="tabela"||UI.view==="fila") autosizeAll();
  renderSelbar(); atualizaUndo();
}
function opts(sel,list,label,cur){ const el=$(sel); el.innerHTML=`<option value="">${label}</option>`+list.map(([v,l])=>`<option value="${esc(v)}"${v===cur?" selected":""}>${esc(l)}</option>`).join(""); el.classList.toggle("set",!!cur); }
function renderSelects(rows){
  const u=k=>[...new Set(rows.map(r=>r[k]))];
  const eq=[...new Set(CFG().equipe.concat(u("resp").filter(Boolean)))];
  opts("#fSit",Object.entries(SIT),"Situação",UI.sit);
  opts("#fMeta",u("meta").sort((a,b)=>mIdx(a)-mIdx(b)).map(v=>[v,v]),"Meta",UI.meta);
  opts("#fTema",u("tema").sort().map(v=>[v,temaLbl(v)]),"Matéria",UI.tema);
  opts("#fFase",[["__none","Sem fase registrada"]].concat(FASES.map(v=>[v,v])),"Fase",UI.fase);
  opts("#fResp",[["__none","Sem responsável"]].concat(eq.map(v=>[v,v])),"Responsável",UI.resp);
  opts("#fArea",u("area").sort().map(v=>[v,v]),"Área",UI.area);

function tiles(f){

function heatmap(){
  const rows=filtered(all(),"meta").filter(r=>!UI.tema||r.tema===UI.tema);
  const A=filtered(all(),"tema");
  const metas=[...new Set(A.map(r=>r.meta))].sort((a,b)=>mIdx(a)-mIdx(b));
  const src=filtered(all(),"meta_tema");
  const temas=[...new Set(src.map(r=>r.tema))].sort((a,b)=>src.filter(r=>r.tema===b).length-src.filter(r=>r.tema===a).length);
  const cell=(L,meta,tema)=>{ if(!L.length) return `<td class="hm0">·</td>`; const s=stats(L), pp=pct(s.pend,s.t), mix=Math.round(10+pp*0.55);
    const on=(UI.meta===meta||!meta)&&(UI.tema===tema||!tema)&&(meta||tema)&&(UI.meta||UI.tema);
    return `<td><button type="button" class="hc${on?" on":""}" style="background:color-mix(in srgb, var(--pend) ${mix}%, var(--surface))" data-hm="${esc(meta||"")}|${esc(tema||"")}" data-tip="<b>${esc(meta||"Todas as metas")} · ${esc(temaLbl(tema||"")||"Todas as matérias")}</b><br>${fmtN(s.t)} processos · ${fmtN(s.pend)} pendentes (${fmtP(pp)})<br>${fmtN(s.s)} sentenciados · ${fmtN(s.b)} baixados">${fmtN(s.t)}</button></td>`; };
  const body=metas.map(m=>{ const Lm=src.filter(r=>r.meta===m); return `<tr><th scope="row">${esc(m)}</th>${temas.map(t=>cell(Lm.filter(r=>r.tema===t),m,t)).join("")}${cell(Lm,m,"")}</tr>`; }).join("");
  const foot=`<tr class="tot"><th scope="row">Total</th>${temas.map(t=>cell(src.filter(r=>r.tema===t),"",t)).join("")}${cell(src,"","")}</tr>`;
  void rows;
  return `<div class="card"><div class="card-h"><h2>Mapa do acervo · meta × matéria</h2><span class="hmleg"><span>menos pendentes</span><i></i><span>mais pendentes</span></span></div><div class="card-b"><div class="scroll"><table class="hm"><thead><tr><th></th>${temas.map(t=>`<th>${esc(temaLbl(t))}</th>`).join("")}<th>Total</th></tr></thead><tbody>${body}${foot}</tbody></table></div><div class="hint" style="margin-top:8px">Número = processos; cor = proporção pendente de sentença. Clique numa célula para filtrar.</div></div></div>`;
}
function distribuicao(){
  const A=all(), d=UI.dim||"meta";
  let rows=filtered(A,d), order=null, lbl=null, hint=null;
  if(d==="meta") order=(a,b)=>mIdx(a)-mIdx(b);
  if(d==="tema") lbl=temaLbl;
  if(d==="grupo") lbl=v=>GLBL[v]||v;
  if(d==="fase"){ rows=rows.map(r=>r.fase?r:{...r,fase:"__none"}); lbl=v=>v==="__none"?"Sem fase registrada":v; }
  if(d==="resp"){ rows=rows.map(r=>r.resp?r:{...r,resp:"__none"}); lbl=v=>v==="__none"?"Sem responsável":v; }
  if(d==="tipoS"){ rows=rows.filter(r=>r.s).map(r=>r.tipoS?r:{...r,tipoS:"__none"}); lbl=v=>v==="__none"?"Tipo não informado":v; hint="% baixado · total"; }
  if(d==="leg"){ const x=[]; for(const r of rows) for(const l of r.leg) x.push({...r,leg:l}); rows=x; }

}

function histTxt(h){ return h.k==="nota"?h.v:h.k==="obs"?"Editou a observação":h.k==="restaurar"||h.k==="import"?h.v:`${LABEL[h.k]||h.k}: ${h.de} → ${h.para}`; }
function viewRegistro(){
  const E=[], nmap=new Map(all().map(r=>[r.id,r]));
  for(const id in S.edicoes){ const r=nmap.get(id); for(const h of (S.edicoes[id].hist||[])) E.push({t:h.t,por:h.por||"",id:r?id:"",n:r?r.n:id,txt:histTxt(h)}); }
  for(const id in S.novos){ const x=S.novos[id]; if(x.criado) E.push({t:x.criado,por:x.criadoPor||"",id,n:x.n,txt:"Incluiu o processo no painel"}); }
  for(const id in S.autorizados){ const x=S.autorizados[id]; if(x&&x.em&&x.por&&x.por!=="(fundador)") E.push({t:x.em,por:x.por,id:"",n:"",txt:`Autorizou o login ${id} (${x.nome||""})`}); }
  for(const id in S.importacoes){ const x=S.importacoes[id]; E.push({t:Date.parse(x.em),por:x.por||"",id:"",n:"",txt:`Importou a planilha ${x.arquivo} (${fmtN(x.total||0)} processos)`}); }
  const pessoas={}; E.forEach(e=>{ const k=e.por||"(sem identificação)"; pessoas[k]=(pessoas[k]||0)+1; });

    html+=`<li class="ev"><time>${new Date(e.t).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</time><span class="avatar">${esc(initials(e.por||"?"))}</span><div><b>${esc(e.por||"Sem identificação")}</b> ${esc(e.txt)}${e.n?` · ${e.id?`<button type="button" class="lnk2" data-f="open:${esc(e.id)}">${esc(e.n)}</button>`:`<span class="mono">${esc(e.n)}</span>`}`:""}</div></li>`; }
  return `<div class="card"><div class="card-h"><h2>Quem alterou o quê</h2><span class="hint">${fmtN(total)} registro${total===1?"":"s"}${q?" para a busca":""}</span></div><div class="card-b" style="display:grid;gap:14px">
    <div class="legchips"><button type="button" data-regpor="" aria-pressed="${!UI.regPor}">Todos</button>${Object.entries(pessoas).sort((a,b)=>b[1]-a[1]).map(([p,n])=>`<button type="button" data-regpor="${esc(p)}" aria-pressed="${UI.regPor===p}">${esc(p)} · ${fmtN(n)}</button>`).join("")}</div>
    ${L.length?`<ul class="log">${html}</ul>`:'<div class="emptyc">Nenhuma alteração registrada ainda.</div>'}
    ${total>L.length?`<button type="button" class="more" data-reglim="1">Mostrar mais ${fmtN(Math.min(150,total-L.length))}</button>`:""}
    <p class="hint" style="margin:0">A identificação é o nome informado ao entrar no painel. Cada processo guarda suas 25 alterações mais recentes.</p></div></div>`;

  return `<div role="button" tabindex="0" class="pcard${me?" me":""}${UI.resp===key?" on":""}" data-f="resp:${esc(key)}" data-go="tabela">
    <span class="p-top"><span class="avatar lg" style="${papel==="Cartório"?"background:var(--baix);color:#fff":nome==="__none"?"":"background:var(--accent);color:#fff"}">${nome==="__none"?"?":esc(initials(nome))}</span><span><b>${nome==="__none"?"Sem responsável":esc(nome)}${me?' <span class="you">você</span>':""}</b><span class="hint">${esc(papel)}</span></span></span>

    <span class="p-go">Abrir fila →<span class="p-acts">${nome!=="__none"&&nome!==UI.eu&&UI.eu&&loginOf(nome)?`<button type="button" class="pexp" data-dm="${esc(nome)}" title="Conversar com ${esc(nome)}">💬 Mensagem</button>`:""}${downloads?`<button type="button" class="pexp" data-expfila="${esc(key)}" title="Exportar a fila para Excel">⤓ Excel</button>`:""}</span></span></div>`;
}
function frentes(f){

  const m2=gab.filter(r=>r.meta==="Meta 02").length, par=gab.filter(r=>r.dias!=null&&r.dias>lim).length, old=gab.filter(r=>r.ano!=="—"&&+r.ano<=new Date().getFullYear()-5).length;
  const provs={}; car.forEach(r=>{ const k=r.prov||"__none"; provs[k]=(provs[k]||0)+1; });

    <header><span class="badge-f">Gabinete</span><h2>Sentenciar</h2><button type="button" class="btn" data-f="sit:pend" data-go="tabela">Abrir lista →</button></header>
    <div class="f-main">${ring(pS,"var(--agu)","Índice de sentenças")}<div><div class="f-big">${fmtN(gab.length)}</div><div class="f-lbl">processos aguardando sentença</div><div class="hint">Índice de sentenças: <b>${fmtP(pS)}</b> (${fmtN(S_.s)} de ${fmtN(S_.t)})</div></div></div>
    <div class="f-chips"><button type="button" data-f="meta:Meta 02"><b>${fmtN(m2)}</b> da Meta 02</button><button type="button" data-f="parado:lim"><b>${fmtN(par)}</b> conclusos +${lim} dias</button><button type="button" data-f="sit:pend"><b>${fmtN(old)}</b> com 5+ anos</button><button type="button" data-f="leg:Réu preso"><b>${fmtN(gab.filter(r=>r.leg.includes("Réu preso")).length)}</b> réu preso</button></div>
  </section>
  <section class="frente car">
    <header><span class="badge-f c">Cartório</span><h2>Baixar</h2><button type="button" class="btn" data-f="sit:agu" data-go="tabela">Abrir lista →</button></header>
    <div class="f-main">${ring(pB,"var(--baix)","Índice de baixas")}<div><div class="f-big">${fmtN(car.length)}</div><div class="f-lbl">sentenciados aguardando baixa</div><div class="hint">Índice de baixas: <b>${fmtP(pB)}</b> dos sentenciados · <b>${fmtN(S_.b)}</b> baixados (${fmtP(pct(S_.b,S_.t))} do acervo)</div></div></div>

    ${tB.some(x=>x[1])?`<span class="hint">Desde a sentença: ${tB.map(([l,n])=>`<b>${fmtN(n)}</b> ${l}`).join(" · ")}</span>`:""}</div>
  </section></div>`;
}
function pessoas(f){

function filas(f){
  const pend=f.filter(r=>r.sit==="pend").sort((a,b)=>(b.prio-a.prio)||(b.leg.length-a.leg.length)||((b.dias??-1)-(a.dias??-1))||(a.ano-b.ano)).slice(0,8);

const NUM_RE=/\d{7}-\d{2}\.\d{4}\.\d\.\d{2}\.\d{4}/g;
function stepsOf(r){ const base=(CHK[r.prov]||CHK[""]).slice(); if(r.tipoS==="Condenatória"&&!base.includes("Guia de execução expedida")) base.splice(Math.max(0,base.length-1),0,"Guia de execução expedida"); return base; }

function mentionsOf(t){ const low=String(t||"").toLowerCase(), A=(typeof autorizados==="function")?autorizados():{}, out=new Set();
  for(const k in A){ const a=A[k]; if(low.includes("@"+k.toLowerCase())||(a.nome&&low.includes("@"+a.nome.toLowerCase()))) out.add(a.nome||k); }
  for(const n of CFG().equipe) if(low.includes("@"+n.toLowerCase())) out.add(n);
  return [...out]; }
function richText(t){ let h=esc(t); const nm=new Map(all().map(r=>[r.n,r.id]));
  h=h.replace(NUM_RE,m=>nm.has(m)?`<button type="button" class="plink" data-open="${esc(nm.get(m))}">${m}</button>`:`<span class="mono">${m}</span>`);
  const A2=(typeof autorizados==="function")?autorizados():{}; const alvos=[];
  for(const k in A2){ alvos.push([k,A2[k].nome||k]); if(A2[k].nome) alvos.push([A2[k].nome,A2[k].nome]); }
  for(const n of CFG().equipe) alvos.push([n,n]);
  alvos.sort((a,b)=>b[0].length-a[0].length);
  for(const [txt,nome] of alvos){ const re=new RegExp("@"+txt.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","gi"); h=h.replace(re,`<span class="ment${nome===UI.eu?" me":""}">@${esc(txt)}</span>`); }
  return h.replace(/\n/g,"<br>"); }
const seenKey=k=>LSKEY+":seen:"+k+":"+(UI.eu||"");

function mentionsFor(n){ if(!n) return []; const L=[]; const low="@"+n.toLowerCase();
  for(const id in S.comentarios){ const c=S.comentarios[id]; if(c&&c.por!==n&&String(c.texto||"").toLowerCase().includes(low)) L.push({...c}); }
  for(const id in S.chat){ const c=S.chat[id]; if(c&&c.por!==n&&inConv(c,n)&&(String(c.texto||"").toLowerCase().includes(low)||convOf(c).startsWith("dm:"))&&convOf(c)==="geral"&&String(c.texto||"").toLowerCase().includes(low)) L.push({...c,pid:""}); }
  for(const id in S.chat){ const c=S.chat[id]; if(c&&c.por!==n&&convOf(c).startsWith("dm:")&&convOf(c).slice(3).split("|").includes(n)) L.push({...c,pid:"",dm:true}); }
  for(const r of all()){ if(!r.obs) continue; const autor=(r.e&&r.e.updBy)||""; if(autor===n) continue; if(mentionsOf(r.obs).includes(n)) L.push({t:r.upd||0,por:autor,texto:r.obs,pid:r.id,obs:true}); }
  return L.sort((a,b)=>b.t-a.t); }
function hojeCount(){ if(!UI.eu) return 0; const A=all(), td=today(); let n=0;

const COLS=[["ck",""],["prio","★"],["n","Número do processo"],["obs","Observações"],["classe","Classe"],["meta","Meta"],["tema","Matéria"],["s","Sentenciado"],["b","Baixado"],["sit","Situação"],["fase","Fase / providência"],["dias","Parado"],["resp","Responsável"],["upd","Editado"],["",""]];
const SITORD={pend:0,anom:1,agu:2,baix:3};
function sortRows(f){
  const k=UI.sort,d=UI.dir;
  return f.slice().sort((a,b)=>{ let x=a[k],y=b[k];
    if(k==="sit"){x=SITORD[x];y=SITORD[y];} if(k==="meta"){x=mIdx(x);y=mIdx(y);} if(typeof x==="boolean"){x=+x;y=+y;}
    if(k==="n"){x=a.ano+a.n;y=b.ano+b.n;} if(k==="obs"){x=x?0:1;y=y?0:1;} if(k==="dias"){x=a.dias??a.diasB??-1;y=b.dias??b.diasB??-1;} if(k==="resp"){x=x||"~";y=y||"~";}
    return (x>y?1:x<y?-1:0)*d||a.n.localeCompare(b.n); });
}

/* ---------- Metas ---------- */
function viewMetas(f){
  const g={}; for(const r of f){ (g[r.meta]=g[r.meta]||[]).push(r); }
  const keys=Object.keys(g).sort((a,b)=>mIdx(a)-mIdx(b));
  if(!keys.length) return '<div class="card empty">Nenhum processo no recorte.</div>';
  let hero="";
  const m2=g["Meta 02"];
  if(m2){ const R=ritmo(m2), S_=stats(m2);
    const v=R.pend===0?["var(--agu-bg)","var(--agu)","Meta cumprida"]:R.ok?["var(--agu-bg)","var(--agu)","No ritmo"]:["var(--anom-bg)","var(--anom)","Abaixo do ritmo"];
    hero=`<div class="card hero"><div style="display:grid;gap:10px;align-content:start"><span class="eyebrow">Ritmo da Meta 02</span><h2>${fmtN(S_.s)} de ${fmtN(S_.t)} julgados</h2><span class="verdict" style="background:${v[0]};color:${v[1]}">${v[2]}</span>
      <p class="hint" style="margin:0">Prazo considerado: <b>${fmtDate(R.prazo)}</b> (${fmt1(R.weeks)} semanas). Ritmo atual = sentenças da Meta 02 registradas nos últimos 28 dias ÷ 4. ${R.pend&&!R.ok?`Mantido o ritmo atual, restarão cerca de <b>${fmtN(R.proj)}</b> pendentes no prazo.`:""}</p>
      <div class="meter" style="height:8px;border-radius:4px;background:var(--track);overflow:hidden"><span style="display:block;height:100%;width:${pct(S_.s,S_.t)}%;background:var(--accent);border-radius:4px"></span></div>
      <button type="button" class="btn" data-cfg="1" style="width:max-content">Alterar prazo</button></div>
      <div class="hstats"><div><b>${fmtN(R.pend)}</b><span>pendentes</span></div><div><b>${fmt1(R.weeks)}</b><span>semanas até o prazo</span></div><div><b>${fmt1(Math.ceil(R.nec*10)/10)}</b><span>sentenças/semana necessárias</span></div><div><b style="color:${R.ok?"var(--agu)":"var(--anom)"}">${fmt1(R.atual)}</b><span>ritmo atual/semana</span></div></div></div>`; }
  return hero+`<div class="grid metas">${keys.map(k=>{ const L=g[k], S_=stats(L), p=pct(S_.s,S_.t), R=30, C=2*Math.PI*R, rt=ritmo(L);
    const old=L.filter(r=>!r.s).sort((a,b)=>(a.ano-b.ano)||a.n.localeCompare(b.n)).slice(0,5);
    const col=p>=75?"var(--agu)":p>=40?"var(--baix)":"var(--pend)";
    return `<div class="card mcard"><div class="hd"><svg class="ring" viewBox="0 0 74 74"><circle cx="37" cy="37" r="${R}" fill="none" stroke="var(--track)" stroke-width="8"/><circle cx="37" cy="37" r="${R}" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${C*p/100} ${C}" transform="rotate(-90 37 37)"/><text x="37" y="41" text-anchor="middle" font-size="13" font-weight="600" fill="var(--ink)">${Math.round(p)}%</text></svg>
      <div><h3>${esc(k)}</h3><div class="sub">${fmtN(S_.s)} de ${fmtN(S_.t)} sentenciados${rt.pend?` · ${fmt1(Math.ceil(rt.nec*10)/10)}/semana necessárias`:""}</div></div></div>
      <div class="mstats"><div><b>${fmtN(S_.pend)}</b><span>pendentes</span></div><div><b>${fmtN(S_.agu)}</b><span>aguard. baixa</span></div><div><b>${fmtN(S_.b)}</b><span>baixados</span></div></div>
      ${old.length?`<div><div class="eyebrow" style="margin-bottom:4px">Mais antigos sem sentença</div><ul class="old">${old.map(r=>`<li><button type="button" data-f="open:${esc(r.id)}"><span class="mono">${esc(r.n)}</span><span class="cl">${esc(r.classe)}</span></button></li>`).join("")}</ul></div>`:'<div class="hint">Todos sentenciados ✓</div>'}
      <button type="button" class="btn" data-f="meta:${esc(k)}" data-go="tabela">Ver na planilha</button></div>`; }).join("")}</div>`;
}

/* ---------- Prazos ---------- */
function viewPrazos(f){
  const lim=CFG().limite, conc=f.filter(r=>r.dias!=null), sem=f.filter(r=>r.sit==="pend"&&!r.dtC);
  const bk=[["0-30","Até 30 dias","var(--line)",r=>r.dias<=30],["31-60","31 a 60 dias","var(--pend)",r=>r.dias>30&&r.dias<=60],["61-100","61 a 100 dias","var(--pend)",r=>r.dias>60&&r.dias<=100],["101-","Mais de 100 dias","var(--anom)",r=>r.dias>100]];
  const media=conc.length?conc.reduce((a,r)=>a+r.dias,0)/conc.length:0;
  const list=conc.slice().sort((a,b)=>b.dias-a.dias).slice(0,60);
  const agu=f.filter(r=>r.diasB!=null).sort((a,b)=>b.diasB-a.diasB).slice(0,10);
  const tbl=(L,cols)=>`<div class="scroll"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>${L}</tbody></table></div>`;
  return `<div class="card"><div class="card-h"><h2>Tempo desde a conclusão</h2><span class="hint">${fmtN(conc.length)} pendentes com data de conclusão · média ${fmtN(Math.round(media))} dias · limite de alerta ${lim} dias</span></div><div class="card-b"><div class="buckets">${bk.map(([k,l,c,fn])=>{ const n=conc.filter(fn).length; return `<button type="button" class="bk${UI.parado===k?" on":""}" data-f="parado:${k}"><span>${l}</span><b>${fmtN(n)}</b><i style="background:${c}"></i></button>`; }).join("")}</div>
    ${sem.length?`<p class="hint" style="margin:12px 0 0">${fmtN(sem.length)} processos pendentes estão sem data de conclusão. <button type="button" class="btn ghost" data-f="parado:sem" style="padding:2px 8px">Ver e registrar</button> — ao definir a fase “Concluso para…”, a data de hoje é preenchida automaticamente.</p>`:""}</div></div>
  <div class="card"><div class="card-h"><h2>Conclusos há mais tempo</h2><span class="hint">clique para abrir a ficha</span></div>${list.length?tbl(list.map(r=>`<tr data-id="${esc(r.id)}" style="cursor:pointer"><td>${daysBadge(r.dias)}</td><td class="mono">${esc(r.n)}${legHtml(r)}</td><td class="cls">${esc(r.classe)}</td><td><span class="tag${r.meta!=="Estratégico"?" meta":""}">${esc(r.meta)}</span></td><td>${esc(r.fase)||"—"}</td><td class="num">${fmtDate(r.dtC)}</td><td>${respHtml(r)}</td><td class="hint" style="max-width:260px">${esc(r.obs)}</td></tr>`).join(""),["Parado","Número","Classe","Meta","Fase","Concluso em","Responsável","Observações"]):'<div class="card-b"><div class="emptyc">Nenhum processo com data de conclusão neste recorte.</div></div>'}</div>
  ${agu.length?`<div class="card"><div class="card-h"><h2>Sentenciados aguardando baixa há mais tempo</h2></div>${tbl(agu.map(r=>`<tr data-id="${esc(r.id)}" style="cursor:pointer"><td><span class="days">${fmtN(r.diasB)} d</span></td><td class="mono">${esc(r.n)}</td><td class="cls">${esc(r.classe)}</td><td>${fmtDate(r.dtS)}</td><td>${esc(r.tipoS)||"—"}</td></tr>`).join(""),["Desde a sentença","Número","Classe","Sentença em","Tipo"])}</div>`:""}`;
}

function parseSheet(buf){

  const hi=A.findIndex(r=>r.some(c=>/N[úu]mero do Processo/i.test(String(c)))); if(hi<0) throw new Error("Não encontrei a coluna “Número do Processo”.");
  const H=A[hi].map(String), col=re=>H.findIndex(h=>re.test(h));
  const ix=[col(/Inst[âa]ncia/i),col(/N[úu]mero do Processo/i),col(/Classe/i),col(/Pendente de Meta|^Meta$/i),col(/Meta 02 \+15/i),col(/TMPL|Mat[ée]ria/i),col(/Sentenciado/i),col(/Baixado/i)];
  if(ix[6]<0||ix[7]<0) throw new Error("A planilha precisa das colunas “Sentenciado?” e “Baixado?”.");
  const rows=[]; for(const r of A.slice(hi+1)){ const n=String(r[ix[1]]||"").trim(); if(!/\d{7}-\d{2}\.\d{4}/.test(n)) continue; rows.push(ix.map(i=>i<0?"":String(r[i]).trim())); }

  if(act){ const a=act.dataset.act; if(a==="s"||a==="b"||a==="prio"){ edit(id,{[a]:!r[a]}); return; } if(a==="open"){ openP(id); return; } }
  if(host.classList.contains("kc")||host.tagName==="TR"&&!host.closest("#plist")) openP(id);
});
V.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.classList.contains("kc")) openP(e.target.dataset.id); if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("pcard")){ e.preventDefault(); e.target.click(); } });

/* bulk */
const SB=$("#selbar");
function bulk(kind,val){
  const ids=[...UI.sel];
  if(kind==="clear"){ UI.sel.clear(); renderMain(); return; }
  if(kind==="sent") editMany(ids,()=>({s:true}),"marcados como sentenciados");
  else if(kind==="baix") editMany(ids,()=>({b:true}),"marcados como baixados");
  else if(kind==="prio") editMany(ids,()=>({prio:true}),"marcados como prioritários");
  else if(kind==="fase"&&val) editMany(ids,()=>({fase:val==="__clear"?"":val}),val==="__clear"?"fase removida":`fase “${val}”`);
  else if(kind==="resp"&&val) editMany(ids,()=>({resp:val==="__clear"?"":val}),val==="__clear"?"responsável automático":`atribuídos a ${val}`);
  else if(kind==="prov"&&val) editMany(ids.filter(id=>{ const r=byId(id); return r&&r.sit==="agu"; }),()=>({prov:val==="__clear"?"":val}),val==="__clear"?"providência removida":`providência “${val}” (só sentenciados não baixados)`);
  else if(kind==="leg"&&val) editMany(ids,r=>({leg:r.leg.includes(val)?r.leg:r.leg.concat(val)}),`prioridade legal “${val}”`);
}
SB.addEventListener("click",e=>{ const b=e.target.closest("button[data-bulk]"); if(b) bulk(b.dataset.bulk); });
SB.addEventListener("change",e=>{ const s=e.target.closest("select[data-bulk]"); if(s&&s.value) bulk(s.dataset.bulk,s.value); });
/* drag & drop */
let dragId=null;
V.addEventListener("dragstart",e=>{ const c=e.target.closest(".kc"); if(!c) return; dragId=c.dataset.id; c.classList.add("drag"); e.dataTransfer.effectAllowed="move"; try{ e.dataTransfer.setData("text/plain",dragId); }catch(_){} });
V.addEventListener("dragend",e=>{ const c=e.target.closest(".kc"); if(c) c.classList.remove("drag"); document.querySelectorAll(".col.over").forEach(x=>x.classList.remove("over")); });
V.addEventListener("dragover",e=>{ const col=e.target.closest(".col"); if(!col||!dragId) return; e.preventDefault(); document.querySelectorAll(".col.over").forEach(x=>x!==col&&x.classList.remove("over")); col.classList.add("over"); });
V.addEventListener("drop",e=>{ const col=e.target.closest(".col"); if(!col||!dragId) return; e.preventDefault(); if(needLogin()){ dragId=null; return; } const k=col.dataset.col, r=byId(dragId); dragId=null; if(!r) return;
  if(r.sit===k||(k==="baix"&&r.sit==="anom")){ renderMain(); return; }
  const prev=S.edicoes[r.id]?JSON.parse(JSON.stringify(S.edicoes[r.id])):null;
  const p = k==="pend"?{s:false,b:false}:k==="agu"?{s:true,b:false}:{s:true,b:true};
  edit(r.id,p); toast(`${r.n} → ${SIT[k]}`,["Desfazer",()=>{ put("edicoes",r.id,prev); render(); }]); });

/* drawer */
let obsT; const L=$("#layer");
L.addEventListener("click",e=>{
  const ot=e.target.closest("[data-open]"); if(ot){ openP(ot.dataset.open); return; }
  const at=e.target.closest("[data-at]"); if(at){ const t=$("#cTxt"); if(t){ t.value+=(t.value&&!/\s$/.test(t.value)?" ":"")+"@"+at.dataset.at+" "; t.focus(); } return; }
  const dxa=e.target.closest("[data-dx]"); if(dxa&&UI.open&&dxa.dataset.dx!=="chk"){ handleDx(dxa); return; }
  const lg=e.target.closest("[data-leg]");
  if(lg&&UI.open){ const r=byId(UI.open), l=lg.dataset.leg; edit(UI.open,{leg:r.leg.includes(l)?r.leg.filter(x=>x!==l):r.leg.concat(l)}); return; }
  const s=e.target.closest("[data-set]");
  if(s&&UI.open){ const k=s.dataset.set, v=s.dataset.v==="1", p={[k]:v}; if(k==="s"&&v&&$("#dtS").value) p.dtS=$("#dtS").value; if(k==="b"&&v&&$("#dtB").value) p.dtB=$("#dtB").value; flushObs(); edit(UI.open,p); return; }
  const a=e.target.closest("[data-act]"); if(!a) return; const act=a.dataset.act;
  if(act==="close"){ flushObs(); UI.open=null; renderDrawer(); renderMain(); }
  else if(act==="closem") closeLayer();
  else if(act==="restore"){ flushObs(); restore(UI.open); }
  else if(act==="copy"){ const n=byId(UI.open)?.n; try{ navigator.clipboard.writeText(n).then(()=>toast("Número copiado."),()=>toast(n)); }catch(_){ toast(n); } }
  else if(act==="delnovo"){ const id=UI.open; if(a.dataset.confirm!=="1"){ a.dataset.confirm="1"; a.textContent="Confirmar exclusão"; return; } pushUndo("exclusão de processo incluído",[{coll:"novos",id,prev:snapDoc_("novos",id)},{coll:"edicoes",id,prev:snapDoc_("edicoes",id)}]); put("novos",id,null); if(S.edicoes[id]) put("edicoes",id,null); UI.open=null; scheduleSnap(); render(); toast("Processo excluído."); }
});
L.addEventListener("change",e=>{ if(!UI.open) return; const t0=e.target, r0=byId(UI.open);
  if(t0.dataset&&t0.dataset.dx==="chk"&&r0){ const s=t0.dataset.step, c={...r0.chk}; if(t0.checked) c[s]=true; else delete c[s]; edit(UI.open,{chk:c},{note:`Checklist da baixa: ${s} ${t0.checked?"✓":"(desmarcado)"}`}); return; }
  if(t0.dataset&&t0.dataset.audres&&r0){ setAudRes(UI.open,t0.dataset.audres,t0.value); return; }
  if((t0.id==="recRem"||t0.id==="recRet")&&r0){ const rec={...r0.rec,[t0.id==="recRem"?"dtRem":"dtRet"]:t0.value}; edit(UI.open,{rec},{note:t0.id==="recRem"?`Registrou remessa ao TJ em ${fmtDate(t0.value)}`:`Registrou retorno do TJ em ${fmtDate(t0.value)}`}); return; }
  if(t0.id==="lQuando"){ const d=$("#lData"); if(d) d.hidden=t0.value!=="d"; return; }
  const t=e.target, m={eMeta:"meta",eTema:"tema",eFase:"fase",dtS:"dtS",dtB:"dtB",dtC:"dtC",eTipo:"tipoS",eResp:"resp",eProv:"prov"}[t.id]; if(m) edit(UI.open,{[m]:t.value}); });
function flushObs(){ const t=document.getElementById("eObs"); if(t&&obsT){ clearTimeout(obsT); obsT=null; const r=byId(UI.open); if(r&&t.value!==r.obs) edit(UI.open,{obs:t.value},{silent:true}); } }

L.addEventListener("focusout",e=>{ if(e.target.id==="eObs") flushObs(); });

let NOTIF_T=0, NOTIF_START=Date.now();
function pedirAvisos(){ try{ if(window.Notification&&Notification.permission==="default") Notification.requestPermission(); }catch(e){} }
function checkMencoes(){
  if(!UI.eu) return;
  const L=mentionsFor(UI.eu); if(!L.length) return;
  const nova=L[0]; if(!nova||nova.t<=NOTIF_T||nova.t<NOTIF_START) { NOTIF_T=Math.max(NOTIF_T,nova.t||0); return; }
  NOTIF_T=nova.t;
  const proc=nova.pid?((byId(nova.pid)||{}).n||""):"";
  const titulo=`${nova.por||"Alguém"} mencionou você${proc?" · "+proc:""}`;
  const corpo=String(nova.texto||"").slice(0,140);
  try{ if(window.Notification&&Notification.permission==="granted") new Notification(titulo,{body:corpo,tag:"men"+nova.t}); }catch(e){}
  toast(`@ ${titulo}`, nova.pid?["Abrir",()=>openP(nova.pid)]:["Ver",()=>go("hoje")]);
}
function renderNavCounts(){ checkMencoes(); const h=hojeCount(), ch=$("#cH"); if(ch) ch.textContent=h?String(h):""; const ca=$("#cA"); if(ca){ const td=today(); let n=0; all().forEach(r=>r.aud.forEach(a=>{ if(a.data>=td&&!a.res) n++; })); ca.textContent=n?String(n):""; } renderChatBadge(); }
